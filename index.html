<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — gym &amp; diet tracker</title>
<meta name="description" content="A private gym, diet and body-composition tracker that keeps all of its data in a folder on your own machine.">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233987e5'/><text x='16' y='23' font-size='19' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>F</text></svg>">
</head>
<body>

<div id="boot" class="empty-state" style="padding-top:22vh">
  <h3>Loading your data…</h3>
  <p>Looking for a connected data folder.</p>
</div>

<div class="app" id="app" hidden>
  <nav class="sidebar">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name">Forge</div>
        <div class="brand-sub">gym &amp; diet tracker</div>
      </div>
    </div>
    <button class="nav-item" data-view="home"><span class="nav-icon">◆</span> Home</button>
    <button class="nav-item" data-view="plan"><span class="nav-icon">▦</span> Workout plan</button>
    <button class="nav-item" data-view="diet"><span class="nav-icon">◍</span> Diet plan</button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-view="log"><span class="nav-icon">✓</span> Today's session</button>
    <button class="nav-item" data-view="nutrition"><span class="nav-icon">◐</span> Nutrition log</button>
    <button class="nav-item" data-view="maxes"><span class="nav-icon">▲</span> Strength maxes</button>
    <button class="nav-item" data-view="body"><span class="nav-icon">◉</span> Body</button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-view="progress"><span class="nav-icon">◇</span> Progress</button>
    <button class="nav-item" data-view="profile"><span class="nav-icon">⚙</span> Profile &amp; data</button>
    <div class="sidebar-foot">
      <div id="storage-chip"></div>
    </div>
  </nav>

  <main class="main">
    <header class="topbar">
      <div class="page-title">
        <h1 id="view-title">Dashboard</h1>
        <small id="view-sub"></small>
      </div>
      <div class="spacer"></div>
      <div id="topbar-extra"></div>
      <button class="btn btn-sm" id="theme-toggle" title="Switch theme">◐ Theme</button>
    </header>

    <section class="view" id="view-home"></section>
    <section class="view" id="view-plan"></section>
    <section class="view" id="view-diet"></section>
    <section class="view" id="view-log"></section>
    <section class="view" id="view-nutrition"></section>
    <section class="view" id="view-maxes"></section>
    <section class="view" id="view-body"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-profile"></section>
  </main>
</div>

<div id="onboard-root"></div>
<div class="toasts" id="toasts"></div>

<script src="src/store.js"></script>
<script src="src/data-exercises.js"></script>
<script src="src/data-foods.js"></script>
<script src="src/data-meals.js"></script>
<script src="src/plan.js"></script>
<script src="src/diet.js"></script>
<script src="src/mealphoto.js"></script>
<script src="src/parse.js"></script>
<script src="src/charts.js"></script>
<script src="src/ui.js"></script>
<script src="src/state.js"></script>
<script src="src/views.js"></script>
<script src="src/views2.js"></script>
<script src="src/views3.js"></script>
<script src="src/views4.js"></script>
<script src="src/app.js"></script>
</body>
</html>
