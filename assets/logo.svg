<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="BodyKaLogic">
  <title>BodyKaLogic</title>
  <defs>
    <linearGradient id="bklG" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6fc4"/>
      <stop offset="0.55" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#9085e9"/>
    </linearGradient>
  </defs>

  <!-- The tab icon, reduced from the badge rather than shrunk from it. The full
       badge is a smudge at 16px: its circular text, star and distressed speckle
       all disappear, and only 18% of the pixels carry any ink at all. What does
       survive a 16px reduction is the badge's silhouette — a disc with a ring —
       and its centre monogram, so that is what this keeps.

       The disc is filled rather than outlined because a favicon has to hold its
       own against both a light and a dark tab strip; the badge's own near-black
       would vanish into a dark one. -->
  <circle cx="24" cy="24" r="23" fill="url(#bklG)"/>
  <circle cx="24" cy="24" r="19.2" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.85"/>

  <!-- Slab "B", built from straight edges to echo the badge's athletic face.
       Drawn as paths, not text: a favicon renders outside the page, so a
       font-family here would be whatever the OS decided to substitute. -->
  <g fill="#fff">
    <rect x="16.4" y="13" width="5.1" height="22" rx="0.8"/>
    <path d="M19.5 13 h7.6 l3.3 3.1 v3.4 l-3.3 3.1 h-7.6 z"/>
    <path d="M19.5 22.4 h8.4 l3.6 3.3 v5.9 l-3.6 3.4 h-8.4 z"/>
  </g>
  <g fill="url(#bklG)">
    <path d="M22.8 16.1 h3.6 l1.1 1 v1.3 l-1.1 1 h-3.6 z"/>
    <path d="M22.8 25.5 h4.1 l1.3 1.2 v3.1 l-1.3 1.2 h-4.1 z"/>
  </g>
</svg>
