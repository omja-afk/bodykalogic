<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="BodyKaLogic">
  <title>BodyKaLogic</title>
  <defs>
    <linearGradient id="bklG" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6fc4"/>
      <stop offset="0.55" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#9085e9"/>
    </linearGradient>
  </defs>

  <!-- The tab icon, reduced from the badge rather than shrunk from it. At 16px
       the badge keeps none of its circular motto, EST. line or distressed
       speckle — only about 18% of its pixels carry any ink and the rest reads as
       a smudge. What does survive a reduction is its silhouette: a ringed disc
       with a barbell struck through it. So that is all this keeps.

       The disc is filled rather than outlined because a favicon has to hold its
       own against a dark tab strip as well as a light one, where the badge's own
       near-black would disappear. -->
  <circle cx="24" cy="24" r="23" fill="url(#bklG)"/>
  <circle cx="24" cy="24" r="19" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.8"/>

  <!-- Barbell: bar plus two plates, sized so each stays at least one whole pixel
       wide once the icon is down at 16 across. -->
  <g fill="#fff">
    <rect x="9" y="21.6" width="30" height="4.8" rx="1.6"/>
    <rect x="11.6" y="16.4" width="5.4" height="15.2" rx="1.8"/>
    <rect x="31" y="16.4" width="5.4" height="15.2" rx="1.8"/>
  </g>
</svg>
