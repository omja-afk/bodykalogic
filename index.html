<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BodyKaLogic — fitness backed by data</title>
<meta name="description" content="BodyKaLogic — fitness backed by data, not guesswork. Track training, food and body composition, and sync it across your devices.">
<link rel="stylesheet" href="assets/styles.css?v=202611151536">
<!-- The tab icon is the badge itself, cropped to the stamp. Built by
     assets/src/make-icons.py, which names each file after its own content hash:
     a changed icon is a changed URL, so no cache at any layer can go on serving
     the previous one. A ?v= query string was not enough for exactly that. -->
<link rel="icon" type="image/x-icon" href="assets/icon-59f9e736.ico">
<link rel="apple-touch-icon" href="assets/icon-touch-8ce7d6ce.png">
<meta name="theme-color" content="#0b0c0f">
<!-- The theme is a choice made on this device. Applying it here, before the
     stylesheet has painted anything, is what stops a light-theme user getting a
     flash of the dark one on every load. -->
<script>
  try {
    var t = localStorage.getItem('bkl.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
