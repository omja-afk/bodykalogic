<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BodyKaLogic — fitness backed by data</title>
<meta name="description" content="BodyKaLogic — fitness backed by data, not guesswork. Track training, food and body composition, and sync it across your devices.">
<link rel="stylesheet" href="assets/styles.css?v=202611150351">
<!-- The tab icon is the badge itself, cropped to the stamp. Built by
     assets/src/make-icons.py, which names each file after its own content hash:
     a changed icon is a changed URL, so no cache at any layer can go on serving
     the previous one. A ?v= query string was not enough for exactly that. -->
<link rel="icon" type="image/x-icon" href="assets/icon-59f9e736.ico">
<link rel="apple-touch-icon" href="assets/icon-touch-8ce7d6ce.png">
<meta name="theme-color" content="#0b0c0f">
</head>
<body>

<div id="boot" class="empty-state" style="padding-top:22vh">
  <h3>Loading your data…</h3>
  <p>Checking where your data is.</p>
</div>

<div class="app" id="app" hidden>
  <nav class="sidebar">
    <div class="brand">
      <img class="brand-logo" src="assets/wordmark-on-dark.png?v=202611150351" alt="BodyKaLogic — train smart, grow strong" width="440" height="304">
    </div>
    <button class="nav-item" data-view="home"><span class="nav-icon">◆</span> Home</button>
    <button class="nav-item" data-view="plan"><span class="nav-icon">▦</span> Workout plan</button>
    <button class="nav-item" data-view="diet"><span class="nav-icon">◍</span> Diet plan</button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-view="log"><span class="nav-icon">✓</span> Today's session</button>
    <button class="nav-item" data-view="nutrition"><span class="nav-icon">◐</span> Nutrition log</button>
    <button class="nav-item" data-view="maxes"><span class="nav-icon">▲</span> Strength maxes</button>
    <button class="nav-item" data-view="body"><span class="nav-icon">◉</span> Body</button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-view="progress"><span class="nav-icon">◇</span> Progress</button>
    <button class="nav-item" data-view="profile"><span class="nav-icon">⚙</span> Profile</button>
    <div class="sidebar-foot">
      <div id="storage-chip"></div>
    </div>
  </nav>

  <main class="main">
    <header class="topbar">
      <div class="page-title">
        <h1 id="view-title">Dashboard</h1>
        <small id="view-sub"></small>
      </div>
      <div class="spacer"></div>
      <div id="topbar-extra"></div>
      <button class="btn btn-sm" id="theme-toggle" title="Switch theme">◐ Theme</button>
    </header>

    <section class="view" id="view-home"></section>
    <section class="view" id="view-plan"></section>
    <section class="view" id="view-diet"></section>
    <section class="view" id="view-log"></section>
    <section class="view" id="view-nutrition"></section>
    <section class="view" id="view-maxes"></section>
    <section class="view" id="view-body"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-profile"></section>
  </main>
</div>

<div id="onboard-root"></div>
<div class="toasts" id="toasts"></div>

<script src="src/config.js?v=202611150351"></script>
<script src="src/store.js?v=202611150351"></script>
<script src="src/sync.js?v=202611150351"></script>
<script src="src/data-exercises.js?v=202611150351"></script>
<script src="src/data-foods.js?v=202611150351"></script>
<script src="src/data-meals.js?v=202611150351"></script>
<script src="src/data-quotes.js?v=202611150351"></script>
<script src="src/plan.js?v=202611150351"></script>
<script src="src/diet.js?v=202611150351"></script>
<script src="src/mealphoto.js?v=202611150351"></script>
<script src="src/parse.js?v=202611150351"></script>
<script src="src/charts.js?v=202611150351"></script>
<script src="src/ui.js?v=202611150351"></script>
<script src="src/state.js?v=202611150351"></script>
<script src="src/views.js?v=202611150351"></script>
<script src="src/views2.js?v=202611150351"></script>
<script src="src/views3.js?v=202611150351"></script>
<script src="src/views4.js?v=202611150351"></script>
<script src="src/app.js?v=202611150351"></script>
</body>
</html>
